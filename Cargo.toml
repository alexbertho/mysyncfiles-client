[package]
name = "mysyncfiles-client"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Multi-server Linux file synchronization client with TPM enrollment"

[features]
default = ["tpm"]
tpm = ["dep:tss-esapi"]

[[bin]]
name = "mysync"
path = "src/bin/mysync.rs"

[[bin]]
name = "mysync-release"
path = "src/bin/mysync-release.rs"

[dependencies]
mysync-protocol = { git = "https://github.com/alexbertho/mysyncfiles-server", rev = "d59c38503b72991d26f9032a920eee6943997334", version = "0.4.0" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.4"
hex = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
notify = "8"
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = {
    version = "1",
    features = [
        "fs",
        "io-util",
        "macros",
        "net",
        "process",
        "rt-multi-thread",
        "signal",
        "sync",
        "time",
    ],
}
tokio-util = { version = "0.7", features = ["io"] }
tss-esapi = { version = "7.7", optional = true }
tempfile = "3"
x509-parser = "0.18"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"


[dev-dependencies]
walkdir = "2"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
